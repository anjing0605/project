dataset:
  family: Amazon
  name: Photo
  root: D:/project/keynode/project/public_datasets/Amazon
  importance_path: D:/project/keynode/project/public_process/extract/Photo_struct/gnn_node_scores_mean.csv
  node_features_path: D:/project/keynode/project/public_process/extract/Photo_struct/node_features.csv
  old_id_col_in_node_features: node
  community_mode: louvain
  strict_importance_alignment: true
  importance_fill_value: 0.0
  verbose: true
keynode:
  mode: topk
  k: 30
  min_shortest_len: 2
  max_pairs: 200
  task_sampling_mode: hybrid
  random_task_ratio: 0.1
  random_seed: 42
paths:
  k_shortest: 12
  final_k: 12
  raw_k_multiplier: 5
  raw_k_min_extra: 20
  max_hops: 10
  delta: 3
  max_internal_overlap: 0.8
  fallback_relax_overlap: 0.98
  fallback_extra_hops: 3
  top_q: 10
  overlap_threshold: 0.8
  top_m_for_fragility: 5
fragility:
  lambda_E: 0.4
  lambda_LCC: 0.4
  lambda_ASP: 0.2
ranking:
  mode: rank_set
  selector: pred_score_selector
  global_top_q: 10
  train_ratio: 0.8
  top_per_task: 10
  random_state: 42
  fragility_mode: hybrid
  exact_every_n_tasks: 10
  exact_top_ranks: 3
  exact_max_path_len: 5
  progress_every: 20
  eval_mode: hybrid
  eval_early_stop: true
  eval_tol: 0.0001
  eval_debug: false
  lambda_red: 0.1
  allow_negative_gain: -0.005
  max_shared_internal_nodes: 5
  min_marginal_gain: 1.0e-06
  alpha_pred: 1.0
  alpha_gain: 0.0
  normalize_pred_score: false
  normalize_marginal_gain: false
  feature_cols:
  - shortest_len
  - same_community
  - pair_score
  - path_length_int
  - avg_node_importance
  - internal_node_importance
  - avg_edge_bc
  - cross_comm_ratio
  - path_length
  xgb_params:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.9
    colsample_bytree: 0.9
    reg_alpha: 0.0
    reg_lambda: 1.0
    random_state: 42
    objective: reg:squarederror
tensorboard:
  enabled: true
  log_root: outputs/tb
  run_name: photo_rank_rank_set_pred_score_selector
debug:
  enabled: false
scorer:
  fragility_gate: 0.5
  gate_penalty: 0.08
output:
  k_list:
  - 1
  - 3
  - 5
  - 10
  top_n_summary: 10
  metrics_json: outputs/metrics/photo_rank_rank_set_pred_score_selector_metrics.json
  paths_json: outputs/paths/photo_rank_rank_set_pred_score_selector_paths.json
  dataset_csv: outputs/metrics/photo_rank_rank_set_pred_score_selector_dataset.csv
  scored_test_csv: outputs/metrics/photo_rank_rank_set_pred_score_selector_scored_test.csv
  fragility_cache_json: path/outputs/cache/photo_rank_rank_set_pred_score_selector_fragility_cache.json
