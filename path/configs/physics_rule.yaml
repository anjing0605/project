dataset:
  family: Coauthor
  name: Physics
  root: D:/project/keynode/project/public_datasets/Coauthor
  importance_path: D:/project/keynode/project/public_process/extract/Physics_struct/gnn_node_scores_mean.csv
  node_features_path: D:/project/keynode/project/public_process/extract/Physics_struct/node_features.csv
  old_id_col_in_node_features: node
  community_mode: louvain
  strict_importance_alignment: true
  importance_fill_value: 0.0
  verbose: true
keynode:
  mode: topk
  k: 30
  min_shortest_len: 2
  max_pairs: 200
paths:
  k_shortest: 20
  max_hops: 8
  delta: 2
  top_q: 10
  overlap_threshold: 0.6
  top_m_for_fragility: 5
rule_weights:
  avg_node_importance: 0.12
  avg_edge_bc: 0.1
  cross_comm_ratio: 0.03
  fragility_score: 0.65
  path_length: 0.1
scorer:
  fragility_gate: 0.5
  gate_penalty: 0.08
fragility:
  lambda_E: 0.4
  lambda_LCC: 0.4
  lambda_ASP: 0.2
baselines:
  k_candidates: 5
  random_num_trials: 30
  random_num_samples: 5
  random_seed: 42
  use_internal_node_importance: false
tensorboard:
  enabled: true
  log_root: outputs/tb
  run_name: physics_rule
output:
  k_list:
  - 1
  - 3
  - 5
  - 10
  top_n_summary: 10
  metrics_json: outputs/metrics/physics_rule_metrics.json
  paths_json: outputs/paths/physics_rule_paths.json
